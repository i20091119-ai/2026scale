<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>수평을 맞춰라!</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; -webkit-user-select: none; user-select: none; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: linear-gradient(180deg, #bfe6ff, #fff6e0);
    font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; color: #2d4a66;
    -webkit-app-region: drag;
  }
  .logo { font-size: 44px; }
  h1 { margin: 0; font-size: 26px; font-weight: 900; }
  #status { font-size: 16px; color: #5b7a99; min-height: 22px; }
  .bar { width: 260px; height: 8px; border-radius: 999px; background: rgba(0,0,0,.08); overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, #59c88a, #8fdc7a); transition: width .2s; }
  .bar.indeterminate > div { width: 40%; animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
  .sub { font-size: 12px; color: #8a97ad; }
</style>
</head>
<body>
  <div class="logo">⚖️</div>
  <h1>수평을 맞춰라!</h1>
  <div id="status">시작하는 중…</div>
  <div class="bar indeterminate" id="bar"><div id="fill"></div></div>
  <div class="sub">경상남도교육청 경남수학문화관</div>
  <script>
    function setStatus(text, pct) {
      document.getElementById('status').textContent = text;
      var bar = document.getElementById('bar'), fill = document.getElementById('fill');
      if (typeof pct === 'number') {
        bar.classList.remove('indeterminate');
        fill.style.width = Math.max(0, Math.min(100, pct)) + '%';
      } else {
        bar.classList.add('indeterminate');
      }
    }
  </script>
</body>
</html>
